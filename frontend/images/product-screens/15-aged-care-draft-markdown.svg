<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title"><title id="title">Aged Care Award draft Interpretation Matrix Markdown excerpt</title><rect width="1440" height="860" fill="#f4f8f7"/><rect x="54" y="45" width="1332" height="770" rx="12" fill="#fff" stroke="#d5e0df" stroke-width="2"/><rect x="54" y="45" width="1332" height="106" rx="12" fill="#132b37"/><rect x="54" y="120" width="1332" height="31" fill="#132b37"/><text x="94" y="91" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">AWARD EXTRACTOR · ACTUAL MARKDOWN OUTPUT</text><text x="94" y="121" fill="#b7d9d4" font-family="Arial,sans-serif" font-size="15">MA000018 · Aged Care Award · Step 4.1</text><rect x="1087" y="73" width="253" height="44" rx="22" fill="#d88934"/><text x="1213" y="101" fill="#132b37" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">DRAFT · BEFORE HUMAN REVIEW</text><text x="102" y="223" fill="#147c78" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">4_1_OT_CREATION_FORMATTED_RULESET.MD</text><text x="102" y="282" fill="#132b37" font-family="Georgia,serif" font-size="43">Overtime Triggers</text><text x="102" y="327" fill="#38505b" font-family="Arial,sans-serif" font-size="19">The following circumstances increase total overtime hours.</text><line x1="102" x2="1338" y1="365" y2="365" stroke="#d5e0df"/><text x="102" y="423" fill="#132b37" font-family="Georgia,serif" font-size="30" font-weight="700">All Employees</text><text x="102" y="456" fill="#64767d" font-family="Arial,sans-serif" font-size="16">Full-Time, Part-Time, Casual, Day Workers and Shift Workers</text><circle cx="120" cy="513" r="5" fill="#147c78"/><text x="143" y="520" fill="#132b37" font-family="Arial,sans-serif" font-size="19">Overtime is created when weekly ordinary hours exceed 38 hours. [22.1]</text><circle cx="120" cy="572" r="5" fill="#147c78"/><text x="143" y="579" fill="#132b37" font-family="Arial,sans-serif" font-size="19">Overtime is created when fortnightly ordinary hours exceed 76 hours. [22.1]</text><circle cx="120" cy="631" r="5" fill="#147c78"/><text x="143" y="638" fill="#132b37" font-family="Arial,sans-serif" font-size="19">Overtime is created when 21-day ordinary hours exceed 114 hours. [22.1]</text><circle cx="120" cy="690" r="5" fill="#147c78"/><text x="143" y="697" fill="#132b37" font-family="Arial,sans-serif" font-size="19">Overtime is created when four-week ordinary hours exceed 152 hours. [22.1]</text><text x="102" y="766" fill="#64767d" font-family="Arial,sans-serif" font-size="15">Source excerpt shown for product summary. The draft is available for reviewer edit before the final Interpretation Matrix is saved.</text></svg>
