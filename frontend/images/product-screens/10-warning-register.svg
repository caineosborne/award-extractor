<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title"><title id="title">Step 4.2 warning register output</title><rect width="1440" height="860" fill="#f4f8f7"/><rect x="52" y="44" width="1336" height="772" rx="12" fill="#fff" stroke="#d5e0df" stroke-width="2"/><rect x="52" y="44" width="1336" height="106" rx="12" fill="#132b37"/><rect x="52" y="119" width="1336" height="31" fill="#132b37"/><text x="92" y="90" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">AWARD EXTRACTOR · STEP 4.2</text><text x="92" y="120" fill="#b7d9d4" font-family="Arial,sans-serif" font-size="15">Warning register · MA000018 Aged Care Award</text><text x="92" y="208" fill="#147c78" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">CONTROL OUTPUT</text><text x="92" y="252" fill="#132b37" font-family="Georgia,serif" font-size="34">Warnings made visible for review</text><rect x="92" y="289" width="1236" height="70" rx="7" fill="#fff8d6"/><text x="120" y="333" fill="#765819" font-family="Arial,sans-serif" font-size="19" font-weight="700">29 unique warnings require review. 12 repeated stage occurrences have been merged.</text><rect x="92" y="391" width="1236" height="116" rx="8" fill="#fff" stroke="#d5e0df" stroke-width="2"/><circle cx="126" cy="432" r="15" fill="#d88934"/><text x="126" y="438" fill="#132b37" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="160" y="430" fill="#132b37" font-family="Arial,sans-serif" font-size="19" font-weight="700">Day-worker span boundary is classified as applying to all work arrangements,</text><text x="160" y="458" fill="#132b37" font-family="Arial,sans-serif" font-size="19" font-weight="700">but the rule is written as applying to day workers.</text><text x="160" y="487" fill="#64767d" font-family="Arial,sans-serif" font-size="15">Raised by: 3.1 Expert A, 3.1 Expert B and 3.1 Combined · Source clause 22.2</text><rect x="92" y="532" width="1236" height="116" rx="8" fill="#fff" stroke="#d5e0df" stroke-width="2"/><circle cx="126" cy="573" r="15" fill="#d88934"/><text x="126" y="579" fill="#132b37" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="160" y="571" fill="#132b37" font-family="Arial,sans-serif" font-size="19" font-weight="700">Full-time work beyond rostered ordinary hours is classified as applying to all employees,</text><text x="160" y="599" fill="#132b37" font-family="Arial,sans-serif" font-size="19" font-weight="700">but the rule is written as applying to full-time employees.</text><text x="160" y="628" fill="#64767d" font-family="Arial,sans-serif" font-size="15">Raised by: 3.1 Expert A, 3.1 Expert B and 3.1 Combined · Source clause 25.1</text><rect x="92" y="673" width="1236" height="88" rx="8" fill="#eef5f3" stroke="#c9dfda"/><text x="120" y="713" fill="#147c78" font-family="Arial,sans-serif" font-size="16" font-weight="700">Why it matters</text><text x="120" y="740" fill="#38505b" font-family="Arial,sans-serif" font-size="16">The register consolidates questions for explanation and human judgement; it does not hide uncertainty or silently repair the rules.</text><text x="92" y="790" fill="#64767d" font-family="Arial,sans-serif" font-size="15">Source-faithful product preview based on the live warning-register output.</text></svg>
