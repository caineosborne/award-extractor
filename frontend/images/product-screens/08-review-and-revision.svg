<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title"><title id="title">Step 3.2 review and revised ruleset output</title><rect width="1440" height="860" fill="#f4f8f7"/><rect x="52" y="44" width="1336" height="772" rx="12" fill="#fff" stroke="#d5e0df" stroke-width="2"/><rect x="52" y="44" width="1336" height="106" rx="12" fill="#132b37"/><rect x="52" y="119" width="1336" height="31" fill="#132b37"/><text x="92" y="90" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">AWARD EXTRACTOR · STEP 3.2</text><text x="92" y="120" fill="#b7d9d4" font-family="Arial,sans-serif" font-size="15">Review and revised ruleset · MA000018 Aged Care Award</text><text x="92" y="208" fill="#147c78" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">REVIEW DECISION LEDGER</text><text x="92" y="252" fill="#132b37" font-family="Georgia,serif" font-size="34">Evaluator challenge → creator decision → revised rule</text><rect x="92" y="290" width="355" height="448" rx="8" fill="#fffaf2" stroke="#e4c28a"/><text x="122" y="331" fill="#a65f18" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">EVALUATOR OBSERVATION</text><text x="122" y="374" fill="#132b37" font-family="Arial,sans-serif" font-size="20" font-weight="700">Apply one ordinary-hours</text><text x="122" y="403" fill="#132b37" font-family="Arial,sans-serif" font-size="20" font-weight="700">boundary at a time.</text><text x="122" y="454" fill="#38505b" font-family="Arial,sans-serif" font-size="16">Clause 22.1 contains alternatives:</text><text x="122" y="482" fill="#38505b" font-family="Arial,sans-serif" font-size="16">weekly, averaging-period, roster-cycle</text><text x="122" y="510" fill="#38505b" font-family="Arial,sans-serif" font-size="16">or daily boundary—not cumulative tests.</text><text x="122" y="584" fill="#64767d" font-family="Arial,sans-serif" font-size="14">Source clauses: 22.1, 25.1</text><rect x="542" y="290" width="355" height="448" rx="8" fill="#eef5f3" stroke="#c9dfda"/><text x="572" y="331" fill="#147c78" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">CREATOR DECISION</text><text x="572" y="374" fill="#132b37" font-family="Arial,sans-serif" font-size="20" font-weight="700">Modify and retain</text><text x="572" y="403" fill="#132b37" font-family="Arial,sans-serif" font-size="20" font-weight="700">the supported rule.</text><text x="572" y="454" fill="#38505b" font-family="Arial,sans-serif" font-size="16">Clarify the applicable arrangement,</text><text x="572" y="482" fill="#38505b" font-family="Arial,sans-serif" font-size="16">narrow operative references and align</text><text x="572" y="510" fill="#38505b" font-family="Arial,sans-serif" font-size="16">cohort metadata to each subclause.</text><text x="572" y="584" fill="#64767d" font-family="Arial,sans-serif" font-size="14">Decision: modified · evidence retained</text><rect x="992" y="290" width="356" height="448" rx="8" fill="#132b37"/><text x="1022" y="331" fill="#8ed7cd" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">REVISED RULESET</text><text x="1022" y="374" fill="#fff" font-family="Georgia,serif" font-size="25" font-weight="700">Ordinary-hours</text><text x="1022" y="405" fill="#fff" font-family="Georgia,serif" font-size="25" font-weight="700">boundary selection</text><text x="1022" y="457" fill="#d9edeb" font-family="Arial,sans-serif" font-size="16">Select the applicable weekly, averaging,</text><text x="1022" y="485" fill="#d9edeb" font-family="Arial,sans-serif" font-size="16">roster-cycle or daily ordinary-hours</text><text x="1022" y="513" fill="#d9edeb" font-family="Arial,sans-serif" font-size="16">boundary. Hours beyond that selected</text><text x="1022" y="541" fill="#d9edeb" font-family="Arial,sans-serif" font-size="16">boundary are overtime. [22.1]</text><text x="1022" y="617" fill="#8ed7cd" font-family="Arial,sans-serif" font-size="14">Final outcome: modified</text><text x="92" y="785" fill="#64767d" font-family="Arial,sans-serif" font-size="15">Source-faithful product preview based on the live review and creator-response outputs.</text></svg>
