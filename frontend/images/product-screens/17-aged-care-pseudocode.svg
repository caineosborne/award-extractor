<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title"><title id="title">Aged Care Award generated overtime pseudocode excerpt</title><rect width="1440" height="860" fill="#f4f8f7"/><rect x="54" y="45" width="1332" height="770" rx="12" fill="#fff" stroke="#d5e0df" stroke-width="2"/><rect x="54" y="45" width="1332" height="106" rx="12" fill="#132b37"/><rect x="54" y="120" width="1332" height="31" fill="#132b37"/><text x="94" y="91" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">AWARD EXTRACTOR · ACTUAL PSEUDOCODE OUTPUT</text><text x="94" y="121" fill="#b7d9d4" font-family="Arial,sans-serif" font-size="15">MA000018 · Aged Care Award · Step 5.1</text><text x="102" y="223" fill="#147c78" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">5_1_OT_CREATION_PSEUDOCODE.MD</text><text x="102" y="282" fill="#132b37" font-family="Georgia,serif" font-size="43">Derived Fields</text><rect x="102" y="326" width="1236" height="382" rx="8" fill="#102a37"/><text x="140" y="376" fill="#8ed7cd" font-family="Menlo,monospace" font-size="22">Worked_Hour_Units</text><text x="166" y="419" fill="#fff" font-family="Menlo,monospace" font-size="18">• Split each shift into non-overlapping hour units using Shift_Start and Shift_End.</text><text x="166" y="459" fill="#fff" font-family="Menlo,monospace" font-size="18">• Preserve the relevant calendar date and week, fortnight or roster-cycle record.</text><text x="166" y="499" fill="#fff" font-family="Menlo,monospace" font-size="18">• If a shift crosses midnight, assign each hour unit to the date on which it occurs.</text><text x="140" y="557" fill="#8ed7cd" font-family="Menlo,monospace" font-size="22">Unallocated_Hours</text><text x="166" y="600" fill="#fff" font-family="Menlo,monospace" font-size="18">• Initialise to all Worked_Hour_Units; reduce when an hour is assigned to Overtime_Hours.</text><text x="166" y="640" fill="#fff" font-family="Menlo,monospace" font-size="18">• An hour unit must not be assigned to overtime more than once.</text><text x="140" y="686" fill="#8ed7cd" font-family="Menlo,monospace" font-size="22">Ordinary_Hours = remaining Unallocated_Hours after all overtime rules are applied.</text><text x="102" y="766" fill="#64767d" font-family="Arial,sans-serif" font-size="15">Actual source excerpt shown for product summary. The pseudocode is accompanied by validation outputs before implementation.</text></svg>
